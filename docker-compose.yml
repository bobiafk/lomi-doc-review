# Infrastructure only for now. api, worker, web and the one-shot migrate
# service are added in the phases that introduce them.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lomi
      POSTGRES_PASSWORD: lomi
      POSTGRES_DB: lomi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lomi -d lomi"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
