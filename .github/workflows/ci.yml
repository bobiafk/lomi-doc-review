name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lomi
          POSTGRES_PASSWORD: lomi
          POSTGRES_DB: lomi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lomi -d lomi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://lomi:lomi@localhost:5432/lomi
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build test lint typecheck

  # Every image `docker compose up` needs must build; a broken Dockerfile
  # stage would otherwise only show up on someone's first run.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
